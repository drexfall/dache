name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

# The release starts as a draft and is published only once the AppImage, the APK, the MSI and SHA256SUMS are all
# attached. A failed build leaves an unpublished draft to fix or delete, never a public release with files missing.
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Dache $GITHUB_REF_NAME" --generate-notes

  appimage:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the AppImage
        env:
          PACKAGING_JDK: ${{ env.JAVA_HOME }}
        run: ./gradlew :app:packageAppImage
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" app/build/compose/binaries/main/appimage/*.AppImage

  apk:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed release APK
        env:
          DACHE_KEYSTORE_BASE64: ${{ secrets.DACHE_KEYSTORE_BASE64 }}
          DACHE_KEYSTORE_PASSWORD: ${{ secrets.DACHE_KEYSTORE_PASSWORD }}
          DACHE_KEY_ALIAS: ${{ secrets.DACHE_KEY_ALIAS }}
          DACHE_KEY_PASSWORD: ${{ secrets.DACHE_KEY_PASSWORD }}
        run: |
          if [ -z "$DACHE_KEYSTORE_BASE64" ]; then
            echo "::error::DACHE_KEYSTORE_BASE64 is not set; a release needs the signing key"
            exit 1
          fi
          echo "$DACHE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export DACHE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "Dache-${GITHUB_REF_NAME#v}.apk"
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" Dache-*.apk

  msi:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Test the desktop code on Windows
        run: ./gradlew :core:jvmTest :app:jvmTest
      - name: Build the MSI
        run: ./gradlew :app:packageMsi
      - name: Attach it to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" app/build/compose/binaries/main/msi/*.msi

  publish:
    needs: [appimage, apk, msi]
    runs-on: ubuntu-latest
    steps:
      - name: Add SHA256SUMS and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          for pattern in '*.AppImage' '*.apk' '*.msi'; do
            if ! compgen -G "$pattern" > /dev/null; then
              echo "::error::the draft has no $pattern"
              exit 1
            fi
          done
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
